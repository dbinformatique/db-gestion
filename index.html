<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#21255C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>D&B Informatique — Gestion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 188 188'%3E%3Crect width='188' height='188' rx='44' fill='%233E4CB8'/%3E%3Cg transform='translate(50,34) scale(1.06)'%3E%3Cpath d='M8 4 L8 92 L30 70 L46 108 L64 100 L48 63 L76 60 Z' fill='%23fff' stroke='%23fff' stroke-width='5' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --encre:#21255C; --indigo:#3E4CB8; --indigo-d:#33409F; --rouge:#D62F26; --corail:#FFB4AD;
  --gris:#5A6472; --pale:#ECEEFA; --ligne:#E2E5F5; --blanc:#fff; --fond:#F7F8FE;
  --ok:#1E7A4B; --okbg:#E8F6EE; --warn:#B85C00; --warnbg:#FFF3E4; --dangerbg:#FDEEED;
  --r:12px; --sh:0 1px 3px rgba(33,37,92,.08),0 8px 24px rgba(33,37,92,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--fond);color:#1A1D33;font-size:15px;line-height:1.5;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--indigo);text-decoration:none}

/* ─────── structure ─────── */
#app{display:flex;min-height:100%}
#side{width:240px;background:var(--encre);color:#fff;flex:0 0 240px;position:fixed;inset:0 auto 0 0;
  display:flex;flex-direction:column;z-index:40}
#side .brand{padding:20px 18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.12)}
#side .brand svg{width:36px;height:36px;flex:0 0 auto;border-radius:9px}
#side .brand b{font-size:19px;letter-spacing:-.5px;display:block;line-height:1}
#side .brand b i{color:var(--corail);font-style:normal}
#side .brand span{font-size:8.5px;letter-spacing:2.2px;color:#AEB7EA;display:block;margin-top:3px}
#nav{flex:1;overflow-y:auto;padding:10px 8px}
#nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;color:#C6CCF2;
  font-size:14.5px;font-weight:500;margin-bottom:2px}
#nav a .ic{width:20px;text-align:center;font-size:16px;flex:0 0 20px}
#nav a .badge{margin-left:auto;background:var(--rouge);color:#fff;font-size:11px;font-weight:700;
  min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
#nav a:hover{background:rgba(255,255,255,.07);color:#fff}
#nav a.on{background:var(--indigo);color:#fff;font-weight:600}
#side .foot{padding:12px 16px;font-size:11px;color:#8F98D8;border-top:1px solid rgba(255,255,255,.12)}
#main{flex:1;margin-left:240px;min-width:0;padding:0 0 40px}

#topbar{position:sticky;top:0;z-index:30;background:rgba(247,248,254,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--ligne);padding:14px 26px;display:flex;align-items:center;gap:14px}
#topbar h1{font-size:21px;font-weight:800;color:var(--encre);letter-spacing:-.4px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#burger{display:none}
.wrap{padding:22px 26px;max-width:1280px}

/* ─────── composants ─────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:9px;
  font-weight:600;font-size:14px;background:var(--indigo);color:#fff;white-space:nowrap;transition:.15s}
.btn:hover{background:var(--indigo-d)}
.btn.sec{background:var(--blanc);color:var(--encre);border:1px solid var(--ligne)}
.btn.sec:hover{background:var(--pale)}
.btn.danger{background:var(--rouge)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.icon{padding:8px 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.card{background:var(--blanc);border:1px solid var(--ligne);border-radius:var(--r);box-shadow:var(--sh);
  margin-bottom:18px;overflow:hidden}
.card>h3{font-size:13px;font-weight:800;letter-spacing:1.1px;color:var(--indigo);text-transform:uppercase;
  padding:14px 18px;border-bottom:1px solid var(--ligne);background:#FBFCFF;display:flex;align-items:center;gap:10px}
.card>h3 .r{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none;font-size:13px;color:var(--gris)}
.card .body{padding:18px}
.card .body.p0{padding:0}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--blanc);border:1px solid var(--ligne);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);
  border-top:3px solid var(--indigo)}
.kpi.red{border-top-color:var(--rouge)} .kpi.ok{border-top-color:var(--ok)} .kpi.warn{border-top-color:var(--warn)}
.kpi .lab{font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--gris);text-transform:uppercase}
.kpi .val{font-size:25px;font-weight:800;color:var(--encre);letter-spacing:-.8px;margin:6px 0 2px;line-height:1.1}
.kpi .sub{font-size:12px;color:var(--gris)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--gris);
  padding:11px 14px;border-bottom:1px solid var(--ligne);background:#FBFCFF;white-space:nowrap;position:sticky;top:0}
td{padding:12px 14px;border-bottom:1px solid #F0F2FB;vertical-align:middle}
tbody tr:hover{background:#FBFCFF}
tbody tr.clic{cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.mini{font-size:12.5px;color:var(--gris)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}

.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.gris{background:var(--pale);color:var(--encre)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.red{background:var(--dangerbg);color:#A8231C}
.pill.blue{background:#E4E8FB;color:var(--indigo)}

.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--encre);margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--gris);margin-top:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ligne);border-radius:9px;background:var(--blanc);
  outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(62,76,184,.12)}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}

#modal{position:fixed;inset:0;background:rgba(20,22,50,.55);backdrop-filter:blur(3px);z-index:100;
  display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
#modal.on{display:flex}
#modal .box{background:var(--blanc);border-radius:16px;width:100%;max-width:760px;box-shadow:0 24px 70px rgba(0,0,0,.3);
  margin:auto}
#modal .box.wide{max-width:1000px}
#modal .hd{padding:18px 22px;border-bottom:1px solid var(--ligne);display:flex;align-items:center;gap:12px}
#modal .hd h2{font-size:18px;font-weight:800;color:var(--encre);flex:1}
#modal .bd{padding:22px;max-height:calc(100vh - 220px);overflow-y:auto}
#modal .ft{padding:16px 22px;border-top:1px solid var(--ligne);display:flex;gap:10px;justify-content:flex-end;background:#FBFCFF;
  border-radius:0 0 16px 16px}

.empty{text-align:center;padding:44px 20px;color:var(--gris)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.4}
.empty p{margin-bottom:16px;font-size:14px}

.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{max-width:280px}
.toolbar .sp{flex:1}

.lignes th{background:var(--pale)}
.lignes input{padding:8px 10px;border-radius:7px}
.lignes td{padding:6px 5px;border-bottom:1px solid #F4F5FC}

.alert{padding:13px 16px;border-radius:10px;font-size:13.5px;margin-bottom:16px;border-left:4px solid}
.alert.info{background:var(--pale);border-color:var(--indigo);color:#22254D}
.alert.warn{background:var(--warnbg);border-color:var(--warn);color:#6B3A00}
.alert.red{background:var(--dangerbg);border-color:var(--rouge);color:#8A1F18}
.alert.ok{background:var(--okbg);border-color:var(--ok);color:#14522F}
.alert b{font-weight:800}

.bar{height:8px;background:var(--pale);border-radius:5px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--indigo);border-radius:5px}
.bar i.ok{background:var(--ok)} .bar i.red{background:var(--rouge)} .bar i.warn{background:var(--warn)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--encre);color:#fff;
  padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:200;opacity:0;pointer-events:none;
  transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* ─────── mobile ─────── */
#scrim{display:none;position:fixed;inset:0;background:rgba(20,22,50,.5);z-index:35}
@media(max-width:860px){
  #side{transform:translateX(-100%);transition:transform .22s;width:262px;flex-basis:262px}
  body.menu #side{transform:none}
  body.menu #scrim{display:block}
  #main{margin-left:0}
  #burger{display:inline-flex;font-size:22px;color:var(--encre);padding:2px 4px}
  #topbar{padding:12px 14px}
  #topbar h1{font-size:18px}
  .wrap{padding:16px 14px 90px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kpi{padding:13px 14px}
  .kpi .val{font-size:21px}
  .grid2,.grid3{grid-template-columns:1fr}
  #modal{padding:0}
  #modal .box{border-radius:16px 16px 0 0;margin:auto 0 0;max-width:100%}
  #modal .bd{max-height:calc(100vh - 190px)}
  #modal .ft{border-radius:0}
  table{font-size:13.5px}
  th,td{padding:10px 10px}
}

/* ─────── impression ─────── */
#print{display:none}
@media print{
  #side,#topbar,#scrim,#modal,#toast,#main{display:none!important}
  #print{display:block!important;padding:0;margin:0}
  @page{size:A4;margin:14mm 14mm 16mm}
  body{background:#fff;font-size:11px}
}
.doc{max-width:182mm;color:#1A1D33}
.doc .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16mm}
.doc .hd .lg{display:flex;align-items:center;gap:8px}
.doc .hd .lg svg{width:15mm;height:15mm}
.doc .hd .lg b{font-size:22px;font-weight:800;color:var(--encre);letter-spacing:-1px;display:block;line-height:1}
.doc .hd .lg b i{color:var(--rouge);font-style:normal}
.doc .hd .lg span{font-size:7px;letter-spacing:2.4px;color:var(--indigo);font-weight:700;display:block;margin-top:2px}
.doc .hd .rr{text-align:right}
.doc .hd .rr .t{font-size:24px;font-weight:800;color:var(--encre);letter-spacing:3px;margin-bottom:6px}
.doc .hd .rr div{font-size:10px;color:var(--gris)}
.doc .hd .rr div b{color:var(--encre)}
.doc .parties{display:flex;gap:6mm;margin-bottom:8mm}
.doc .parties>div{flex:1;padding:4mm;border-radius:2mm;font-size:10px;line-height:1.55}
.doc .parties .em{background:var(--pale)}
.doc .parties .cl{border:.4mm solid var(--encre)}
.doc .parties .lb{font-size:7.5px;font-weight:800;letter-spacing:1.6px;color:var(--gris);margin-bottom:2mm}
.doc .parties b{color:var(--encre);font-size:11px}
.doc h4{font-size:9px;font-weight:800;letter-spacing:1.6px;background:var(--encre);color:#fff;padding:2mm 3mm;margin:6mm 0 3mm}
.doc table{font-size:10px;width:100%}
.doc th{background:var(--encre);color:#fff;padding:2.4mm 2.6mm;font-size:9px;position:static}
.doc td{padding:2.4mm 2.6mm;border-bottom:.25mm solid var(--ligne)}
.doc .tot td{background:var(--pale);font-weight:800;color:var(--encre)}
.doc .tot.big td{background:var(--encre);color:#fff;font-size:13px}
.doc .mentions{font-size:9px;color:var(--gris);line-height:1.7;margin-top:6mm}
.doc .mentions b{color:var(--encre)}
.doc .sign{display:flex;gap:6mm;margin-top:10mm}
.doc .sign>div{flex:1;border-top:.5mm solid var(--encre);padding-top:3mm;font-size:9.5px;min-height:26mm}
.doc .sign>div:last-child{border-top-color:var(--rouge)}
.doc .sign b{display:block;color:var(--encre);margin-bottom:2mm;font-size:10.5px}
.doc .pied{margin-top:8mm;padding-top:3mm;border-top:.3mm solid var(--ligne);font-size:8px;color:var(--gris);text-align:center;line-height:1.7}

/* ── écran de verrouillage ── */
body.bloque #app,body.bloque #modal,body.bloque #toast{display:none!important}
#verrou{display:none;position:fixed;inset:0;z-index:400;background:linear-gradient(150deg,#33409F 0%,#21255C 68%);
  align-items:center;justify-content:center;padding:24px}
#verrou.on{display:flex}
#verrou .vbox{width:100%;max-width:380px;text-align:center;color:#fff}
#verrou .vlogo{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:34px}
#verrou .vlogo svg{width:52px;height:52px;border-radius:13px}
#verrou .vlogo b{display:block;font-size:27px;font-weight:900;letter-spacing:-1px;line-height:1}
#verrou .vlogo i{font-style:normal;color:#FFB4AD}
#verrou .vlogo span{display:block;font-size:9px;font-weight:700;letter-spacing:4.4px;color:#AEB7EA;margin-top:3px}
#verrou .vlogo>div{text-align:left}
#verrou h2{font-size:20px;font-weight:800;margin-bottom:8px}
#verrou .vp{font-size:14px;color:#C9CFF4;line-height:1.6;margin-bottom:22px}
#verrou input{width:100%;padding:14px 16px;border-radius:11px;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.1);color:#fff;font-size:17px;text-align:center;letter-spacing:3px}
#verrou input::placeholder{color:#9AA3D8;letter-spacing:0}
#verrou input:focus{outline:none;border-color:#FFB4AD;background:rgba(255,255,255,.16)}
#verrou .btn{width:100%;margin-top:14px;justify-content:center;background:var(--rouge);color:#fff;border:0}
#verrou .btn:disabled{opacity:.5}
#verrou .verr{margin-top:14px;background:rgba(214,47,38,.22);border:1px solid rgba(255,180,173,.45);
  border-radius:10px;padding:10px 14px;font-size:13.5px;color:#FFD9D5}
#verrou .vaide{margin-top:26px;font-size:12.5px;color:#9AA3D8;line-height:1.65}
#verrou .vaide a{color:#FFB4AD}
.puce{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;
  background:var(--pale);color:var(--indigo);white-space:nowrap}
.puce::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.puce.ok{background:#E8F6EE;color:#1E7A4B}
.puce.red{background:#FDEEED;color:#A8231C}
.puce.blue{background:var(--pale);color:var(--indigo)}
.puce.gris{background:#EEF0F5;color:var(--gris)}

/* ─────── visites terrain ─────── */
.onglets{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--ligne)}
.onglets button{padding:10px 16px;font-weight:700;font-size:14px;color:var(--gris);border-bottom:3px solid transparent;margin-bottom:-1px}
.onglets button.on{color:var(--encre);border-bottom-color:var(--indigo)}
.zone{font-size:12px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--indigo);margin:20px 0 8px}
.lst{display:flex;flex-direction:column;gap:10px}
.lc{background:var(--blanc);border:1px solid var(--ligne);border-radius:var(--r);padding:13px 15px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--sh)}
.lc .tx{flex:1;min-width:0}
.lc .tt{font-weight:700;color:var(--encre);overflow-wrap:anywhere}
.lc .mt{font-size:12.5px;color:var(--gris);margin-top:3px;overflow-wrap:anywhere}
.lc .ac{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.st{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--indigo);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--ligne)}
details.mm+input+.st{margin-top:8px}
.cbs{display:flex;flex-wrap:wrap;gap:10px 22px;margin-bottom:14px}
.cb{display:inline-flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
.cb input{width:20px;height:20px;padding:0;flex:0 0 20px;accent-color:var(--indigo)}
details.mm{border:1px solid var(--ligne);border-radius:10px;background:#FBFCFF;margin-bottom:10px}
details.mm>summary{cursor:pointer;padding:12px 14px;font-weight:700;color:var(--encre);font-size:14.5px;list-style:none}
details.mm>summary::-webkit-details-marker{display:none}
details.mm>summary::after{content:"+";float:right;color:var(--indigo);font-weight:800}
details.mm[open]>summary::after{content:"\2212"}
details.mm .mb{padding:0 14px 14px;font-size:14.5px;line-height:1.65}
.mp{font-size:14.5px;line-height:1.7;margin-bottom:10px}
.pitch{background:var(--encre);color:#fff;border-radius:var(--r);padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh)}
.pitch .pt{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--corail);margin-bottom:12px}
.pitch p{font-size:16px;line-height:1.7;margin-bottom:10px}
.pitch p:last-child{margin-bottom:0}
ul.regles,ol.regles{padding-left:20px;font-size:14.5px;line-height:1.7}
ul.regles li,ol.regles li{margin-bottom:6px}
@media(max-width:860px){.lc{flex-direction:column;gap:10px}.lc .ac{flex-direction:row;align-items:center;width:100%;justify-content:space-between}}
</style>
</head>
<body>
<div id="verrou"></div>
<div id="scrim" onclick="document.body.classList.remove('menu')"></div>
<div id="app">
  <aside id="side">
    <div class="brand">
      <svg viewBox="0 0 188 188"><rect width="188" height="188" rx="44" fill="#3E4CB8"/>
        <g transform="translate(50,34) scale(1.06)"><path d="M8 4 L8 92 L30 70 L46 108 L64 100 L48 63 L76 60 Z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g></svg>
      <div><b>D<i>&amp;</i>B</b><span>INFORMATIQUE</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="foot">Vos données vous appartiennent.<br>Exportez une sauvegarde chaque vendredi.</div>
  </aside>
  <main id="main">
    <div id="topbar">
      <button id="burger" onclick="document.body.classList.toggle('menu')">☰</button>
      <h1 id="titre">Tableau de bord</h1>
      <span id="badgeSync" class="puce gris">Local</span>
      <div id="actions"></div>
    </div>
    <div class="wrap" id="vue"></div>
  </main>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<div id="print"></div>
<script>
/* ══════════════════════════════════════════════════════════════
   D&B INFORMATIQUE — Sécurité, verrouillage et synchronisation
   Ce module est chargé AVANT le reste de l'application.
   ══════════════════════════════════════════════════════════════ */
'use strict';

const K_DATA = 'dbi_gestion_v1';
const K_SEC  = 'dbi_sec_v1';
const K_FB   = 'dbi_fb_v1';
const K_SYNC = 'dbi_sync_v1';
const K_APP  = 'dbi_appareil_v1';

const SEC_DEFAUT = {
  mode: 'aucun',        // 'aucun' | 'code'
  iter: 210000,
  sel: '',
  autoLock: 15,         // minutes ; 0 = jamais
  essais: 0,
  bloqueJusqu: 0,
  cloud: false          // synchronisation activée
};

let SEC = secLire();
let CLE = null;           // clé AES-GCM en mémoire uniquement
let DEVERROUILLE = false;
let derniereActivite = Date.now();

function secLire() {

/* ───────────────────── primitives cryptographiques ───────────────────── */
const _enc = new TextEncoder(), _dec = new TextDecoder();
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
const deb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function cryptoDispo() { return !!(window.crypto && window.crypto.subtle && window.crypto.subtle.deriveKey); }

async function deriverCle(code, selB64, iter) {
  const km = await crypto.subtle.importKey('raw', _enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: deb64(selB64), iterations: iter, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function chiffrer(cle, texte) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cle, _enc.encode(texte));
  return { chiffre: true, v: 2, iv: b64(iv), ct: b64(ct) };
}
async function dechiffrer(cle, o) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deb64(o.iv) }, cle, deb64(o.ct));
  return _dec.decode(pt);
}

/* ───────────────────── lecture / écriture du magasin ───────────────────── */
function estChiffre() {
  try { const o = JSON.parse(localStorage.getItem(K_DATA) || 'null'); return !!(o && o.chiffre); }
  catch (e) { return false; }
}
async function donneesLire() {
  const brut = localStorage.getItem(K_DATA);
  if (!brut) return null;
  let o;
  try { o = JSON.parse(brut); } catch (e) { return null; }
  if (o && o.chiffre) {
    if (!CLE) throw new Error('verrouille');
    return JSON.parse(await dechiffrer(CLE, o));
  }
  return o;
}
let _file = Promise.resolve();
function donneesEcrire(obj) {
  const instantane = JSON.stringify(obj);
  _file = _file.then(async () => {
    if (SEC.mode === 'code' && CLE) localStorage.setItem(K_DATA, JSON.stringify(await chiffrer(CLE, instantane)));
    else localStorage.setItem(K_DATA, instantane);
    localStorage.setItem(K_SYNC, JSON.stringify(Object.assign(etatSync(), { modif: Date.now() })));
  }).catch(e => { console.warn('Écriture impossible', e); try { toast('Sauvegarde impossible'); } catch (x) {} });
  return _file;
}
function etatSync() {
  try { return Object.assign({ pousse: 0, modif: 0, horloge: 0 }, JSON.parse(localStorage.getItem(K_SYNC) || '{}')); }
  catch (e) { return { pousse: 0, modif: 0, horloge: 0 }; }
}

async function tenterDeverrouillage() {
  const code = (document.getElementById('vcode') || {}).value || '';
  if (!code) return;
  const btn = document.getElementById('vbtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Vérification…'; }
  try {
    const cle = await deriverCle(code, SEC.sel, SEC.iter);
    const brut = JSON.parse(localStorage.getItem(K_DATA) || 'null');
    if (brut && brut.chiffre) await dechiffrer(cle, brut);     // lève une exception si le code est faux
    CLE = cle;
    SEC.essais = 0; SEC.bloqueJusqu = 0; secEcrire();
    await ouvrirApplication();
  } catch (e) {
    SEC.essais = (SEC.essais || 0) + 1;
    let m = 'Code incorrect.';
    if (SEC.essais >= 5) {
      const delai = Math.min(300, 30 * Math.pow(2, SEC.essais - 5)) * 1000;
      SEC.bloqueJusqu = Date.now() + delai;
      m = 'Code incorrect. Saisies bloquées temporairement.';
    }
    secEcrire();
    vueDeverrouiller(m);
  }
}

function repartirDeZero() {
  if (!confirm('Réinitialiser complètement l\'application ? Toutes les données de cet appareil seront effacées. '
    + 'Cette action est irréversible.')) return;
  if (!confirm('Confirmation : effacer définitivement les données de cet appareil ?')) return;
  localStorage.removeItem(K_DATA); localStorage.removeItem(K_SEC);

let _tAuto = null;
function demarrerAutoLock() {
  ['click', 'keydown', 'touchstart', 'scroll'].forEach(ev =>
    document.addEventListener(ev, () => { derniereActivite = Date.now(); }, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) verifierAutoLock(); });
  clearInterval(_tAuto);
  _tAuto = setInterval(verifierAutoLock, 20000);
}
function verifierAutoLock() {
  if (!DEVERROUILLE || SEC.mode !== 'code' || !SEC.autoLock) return;
  if (Date.now() - derniereActivite > SEC.autoLock * 60000) verrouillerMaintenant();
}
function verrouillerMaintenant() {
  if (SEC.mode !== 'code') { toast('Activez d\'abord un code d\'accès dans les Paramètres'); return; }
  CLE = null; DEVERROUILLE = false;
  D = JSON.parse(JSON.stringify(DEFAUT));
  try { fermer(); } catch (e) {}
  vueDeverrouiller();
}

/* ═════════════════════════ SYNCHRONISATION FIREBASE ═════════════════════════ */
const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.5';
let FB = null;
let SYNC_ETAT = 'hors';   // hors | connexion | ok | erreur

function fbConfig() { try { return JSON.parse(localStorage.getItem(K_FB) || 'null'); } catch (e) { return null; } }
function fbConfigEcrire(o) { localStorage.setItem(K_FB, JSON.stringify(o)); }

async function fbCharger() {
  if (FB) return FB;
  const cfg = fbConfig();
  if (!cfg || !cfg.projectId) throw new Error('Configuration Firebase absente');
  const [app, auth, fs] = await Promise.all([
    import(`${FB_SDK}/firebase-app.js`),
    import(`${FB_SDK}/firebase-auth.js`),
    import(`${FB_SDK}/firebase-firestore.js`)
  ]);
  const a = app.initializeApp(cfg);
  let authentif;
  try { authentif = auth.initializeAuth(a, { persistence: auth.browserLocalPersistence }); }   // e-mail + mot de passe uniquement : pas de gapi ni d'iframe
  catch (e) { authentif = auth.getAuth(a); }
  try { await auth.setPersistence(authentif, auth.browserLocalPersistence); } catch (e) {}
  let db;
  try {
    db = fs.initializeFirestore(a, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
  } catch (e) { db = fs.getFirestore(a); }
  FB = { app: a, auth, fs, authentif, db, user: null, off: null };
  return FB;
}

function badgeSync(etat, texte) {
  SYNC_ETAT = etat;
  const el = document.getElementById('badgeSync');
  if (!el) return;
  const c = { hors: 'gris', connexion: 'blue', ok: 'ok', erreur: 'red' }[etat] || 'gris';
  el.className = 'puce ' + c;
  el.textContent = texte || { hors: 'Local', connexion: 'Connexion…', ok: 'Synchronisé', erreur: 'Erreur' }[etat];
}

async function nuageDemarrer() {
  badgeSync('connexion');
  const f = await fbCharger();
  return new Promise(resolve => {
    f.auth.onAuthStateChanged(f.authentif, async u => {
      f.user = u;
      if (!u) { badgeSync('hors', 'Non connecté'); resolve(false); return; }
      try { await nuageEcouter(); await nuagePousserMaintenant(); badgeSync('ok'); }
      catch (e) { console.warn(e); badgeSync('erreur'); }
      router(); resolve(true);
    });
  });
}

async function nuageConnexion(email, mdp) {
  const f = await fbCharger();
  await f.auth.signInWithEmailAndPassword(f.authentif, email, mdp);
  SEC.cloud = true; secEcrire();
  await nuageDemarrer();
}
async function nuageDeconnexion() {
  if (!FB) return;
  if (FB.off) { FB.off(); FB.off = null; }
  await FB.auth.signOut(FB.authentif);
  FB.user = null; SEC.cloud = false; secEcrire();
  badgeSync('hors'); router(); toast('Déconnecté de la synchronisation');
}

function docRef() { return FB.fs.doc(FB.db, 'entreprises', FB.user.uid); }

async function nuagePousserMaintenant() {
  if (!FB || !FB.user) return;
  const charge = JSON.stringify(D);
  if (charge.length > 900000) {
    toast('Données trop volumineuses pour la synchronisation — archivez les anciens exercices');
    badgeSync('erreur', 'Trop volumineux'); return;
  }
  const h = Date.now();
  await FB.fs.setDoc(docRef(), {
    donnees: charge, horloge: h, appareil: idAppareil(),
    nomAppareil: nomAppareil(), maj: FB.fs.serverTimestamp()
  });
  majEtatSync({ pousse: h, horloge: h });
  badgeSync('ok');
}

let _tPousse = null;
function nuagePousser() {
  if (!FB || !FB.user) return;
  clearTimeout(_tPousse);
  _tPousse = setTimeout(() => nuagePousserMaintenant().catch(e => { console.warn(e); badgeSync('erreur'); }), 1500);
}

async function nuageEcouter() {
  if (FB.off) FB.off();
  const premier = await FB.fs.getDoc(docRef());
  if (premier.exists()) appliquerDistant(premier.data(), true);
  FB.off = FB.fs.onSnapshot(docRef(), s => { if (s.exists()) appliquerDistant(s.data(), false); },
    e => { console.warn('Écoute', e); badgeSync('erreur'); });
}

function appliquerDistant(d, initial) {
  if (!d || !d.donnees) return;
  if (d.appareil === idAppareil()) return;
  const et = etatSync();
  if (d.horloge <= et.horloge) return;
  const conflit = et.modif > et.pousse;         // des modifications locales n'ont pas été poussées
  const adopter = () => {
    try {
      const dist = JSON.parse(d.donnees);
      D = Object.assign({}, DEFAUT, dist, { entreprise: Object.assign({}, DEFAUT.entreprise, dist.entreprise || {}) });
      donneesEcrire(D);
      majEtatSync({ horloge: d.horloge, pousse: d.horloge, modif: d.horloge });
      router(); badgeSync('ok');
      toast('Données mises à jour depuis ' + (d.nomAppareil || 'un autre appareil'));
    } catch (e) { console.warn(e); badgeSync('erreur'); }
  };
  if (!conflit) { adopter(); return; }
  telecharger('DB_Gestion_conflit_local_' + auj() + '.json', JSON.stringify(D, null, 2), 'application/json');
  modal('Deux appareils ont été modifiés',
    `<div class="alert warn">Des modifications faites sur <b>cet appareil</b> n'avaient pas encore été synchronisées,
      et <b>${esc(d.nomAppareil || 'un autre appareil')}</b> a envoyé une version plus récente.</div>
     <p style="font-size:14px;line-height:1.7">Une sauvegarde de la version de cet appareil vient d'être téléchargée
       automatiquement : quel que soit votre choix, rien n'est perdu.</p>`,
    `<button class="btn sec" onclick="fermer();nuagePousserMaintenant()">Garder cet appareil</button>
     <button class="btn" onclick="fermer();__adopter()">Prendre la version distante</button>`);
  window.__adopter = adopter;
}

async function nuageSynchroniser() {
  if (!FB || !FB.user) { toast('Connectez-vous à la synchronisation'); return; }
  badgeSync('connexion');
  try { await nuageEcouter(); await nuagePousserMaintenant(); toast('Synchronisation effectuée'); }
  catch (e) { console.warn(e); badgeSync('erreur'); toast('Synchronisation impossible'); }
}

/* ─────────────────────────── utilitaires ─────────────────────────── */
const N = v => Number(v) || 0;
const fm = v => N(v).toLocaleString('fr-FR', { maximumFractionDigits: 0 });
const fmc = v => fm(v) + ' F';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const auj = () => new Date().toISOString().slice(0, 10);
function fdate(s) { if (!s) return '—'; const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; }
function jours(a, b) { if (!a) return 0; return Math.floor((new Date(b || auj()) - new Date(a)) / 86400000); }
function plusJours(s, n) { const d = new Date(s || auj()); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }
const client = id => D.clients.find(c => c.id === id);
const nomClient = id => { const c = client(id); return c ? c.nom : '—'; };

function enLettres(n) {
  n = Math.round(N(n));
  if (n === 0) return 'zéro';
  const u = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix', 'onze', 'douze',
    'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];
  const d = ['', '', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante', 'soixante', 'quatre-vingt', 'quatre-vingt'];
  function moins100(x) {
    if (x < 20) return u[x];
    const di = Math.floor(x / 10), un = x % 10;
    if (di === 7 || di === 9) return d[di] + '-' + u[10 + un];
    return d[di] + (un === 1 && di !== 8 ? '-et-un' : un ? '-' + u[un] : (di === 8 ? 's' : ''));
  }
  function moins1000(x) {
    if (x < 100) return moins100(x);
    const c = Math.floor(x / 100), r = x % 100;
    return (c > 1 ? u[c] + ' ' : '') + 'cent' + (c > 1 && !r ? 's' : '') + (r ? ' ' + moins100(r) : '');
  }
  let out = '', reste = n;
  const mil = Math.floor(reste / 1000000); reste %= 1000000;
  const mille = Math.floor(reste / 1000); reste %= 1000;
  if (mil) out += (mil > 1 ? moins1000(mil) + ' millions ' : 'un million ');
  if (mille) out += (mille > 1 ? moins1000(mille) + ' mille ' : 'mille ');
  if (reste) out += moins1000(reste);
  return out.trim();
}

/* ─────────────────────────── calculs ─────────────────────────── */
function tauxTva() { const t = N(D.entreprise.tauxTva); return isFinite(t) ? t / 100 : 0.1925; }
function totaux(doc) {
  const ht = (doc.lignes || []).reduce((s, l) => s + N(l.qte) * N(l.pu), 0);
  const rem = ht * (N(doc.remise) / 100);
  const net = ht - rem;
  const tva = Math.round(net * tauxTva());
  return { ht, rem, net, tva, ttc: net + tva };
}
function nextNum(prefixe, liste) {
  const an = new Date().getFullYear();
  const rangs = liste.filter(x => (x.num || '').includes('-' + an + '-'))
    .map(x => parseInt((x.num || '').split('-')[2], 10) || 0);
  const r = (rangs.length ? Math.max.apply(null, rangs) : 0) + 1;
  return prefixe + '-' + an + '-' + String(r).padStart(3, '0');
}
function paye(f) { return (f.paiements || []).reduce((s, p) => s + N(p.montant), 0); }
function reste(f) { return Math.max(0, totaux(f).ttc - N(f.acompte) - paye(f)); }
function statutFacture(f) {
  const r = reste(f);
  if (r <= 0) return { t: 'Soldée', c: 'ok', j: 0 };
  const j = jours(f.date);
  const n = RELANCES.find(x => j > x[0]) || RELANCES[RELANCES.length - 1];
  return { t: n[1], c: n[2], j, action: n[3] };
}
function fiscalDe(caHT) {
  const tva = Math.round(caHT * tauxTva());
  const tauxAc = N(D.entreprise.tauxAcompteIs) || 2.2;
  const acompte = Math.round(caHT * tauxAc / 100);
  return { tva, acompte, total: tva + acompte, tauxAc };
}
function anneeEnCours() { return String(new Date().getFullYear()); }
function facturesAn() { return D.factures.filter(f => (f.date || '').startsWith(anneeEnCours())); }
function caFacture() { return facturesAn().reduce((s, f) => s + totaux(f).net, 0); }
function caEncaisse() { return facturesAn().reduce((s, f) => s + N(f.acompte) + paye(f), 0); }
function encours() { return D.factures.reduce((s, f) => s + reste(f), 0); }
function recurrentMensuel() {
  return D.contrats.filter(c => c.statut === 'Actif')
    .reduce((s, c) => s + N(c.montantMensuel) + (c.options || []).reduce((t, o) => t + N(o.prix), 0), 0);
}
function relancesDues() {
  return D.factures.filter(f => reste(f) > 0).map(f => ({ f, s: statutFacture(f) }))
    .filter(x => x.s.j > 15).sort((a, b) => b.s.j - a.s.j);
}
function pipelinePondere() {
  return D.prospects.filter(p => !['Gagné', 'Perdu'].includes(p.etape))
    .reduce((s, p) => s + N(p.montant) * (N(p.proba) / 100), 0);
}

  if (!tout.length) { v.innerHTML = `<div class="alert ok"><b>Rien à relancer.</b> Toutes vos factures sont soldées.</div>`; return; }
  h += `<div class="alert ${rel.length ? 'red' : 'ok'}"><b>${fmc(tout.reduce((s, x) => s + reste(x.f), 0))}</b>
    facturés et non encaissés, dont <b>${fmc(rel.reduce((s, x) => s + reste(x.f), 0))}</b> nécessitant une action aujourd’hui.
    L’encours n’est pas de l’argent : c’est du travail que vous avez déjà payé et qu’eux n’ont pas encore réglé.</div>`;
  h += `<div class="card"><div class="body p0"><div class="tw"><table>
    <thead><tr><th>Facture</th><th>Client</th><th class="num">Reste dû</th><th class="num">Jours</th>
    <th>Niveau</th><th>Action à mener</th><th></th></tr></thead><tbody>` +
    tout.map(({ f, s }) => `<tr>
      <td><b>${esc(f.num)}</b><div class="mini">${fdate(f.date)}</div></td>
      <td>${esc(nomClient(f.clientId))}<div class="mini">${esc((client(f.clientId) || {}).tel || '')}</div></td>
      <td class="num"><b>${fmc(reste(f))}</b></td>
      <td class="num">${s.j}</td>
      <td><span class="pill ${s.c}">${s.t}</span></td>
      <td class="mini" style="max-width:330px">${esc(s.action || '')}</td>
      <td class="num"><button class="btn sm" onclick="fPaiement('${f.id}')">Encaisser</button></td>
    </tr>`).join('') + `</tbody></table></div></div></div>`;
  v.innerHTML = h;
}

/* ═══════════════════ CLIENTS ═══════════════════ */
function vClients(v, a) {
  a.innerHTML = `<button class="btn sm" onclick="fClient()">+ Client</button>`;
  if (!D.clients.length) {
    v.innerHTML = vide('Aucun client enregistré. Commencez par saisir votre premier client : tout le reste en découle.',
      `<button class="btn" onclick="fClient()">Ajouter un client</button>`); return;
  }
  const q = (v._q || '').toLowerCase();
  const liste = D.clients.filter(c => !q || (c.nom + ' ' + (c.secteur || '') + ' ' + (c.contact || '')).toLowerCase().includes(q));
  v.innerHTML = `<div class="toolbar">
      <input type="search" id="qc" placeholder="Rechercher un client…" value="${esc(v._q || '')}"
        oninput="document.getElementById('vue')._q=this.value;vClients(document.getElementById('vue'),document.getElementById('actions'));document.getElementById('qc').focus()">
      <div class="sp"></div><div class="mini">${liste.length} client(s)</div></div>
    <div class="card"><div class="body p0"><div class="tw"><table>
    <thead><tr><th>Client</th><th>Secteur</th><th>Contact</th><th>Origine</th>
    <th class="num">CA total</th><th class="num">Encours</th><th></th></tr></thead><tbody>` +
    liste.map(c => {
      const fs = D.factures.filter(f => f.clientId === c.id);
      const ca = fs.reduce((s, f) => s + totaux(f).net, 0), en = fs.reduce((s, f) => s + reste(f), 0);
      const ct = D.contrats.filter(x => x.clientId === c.id && x.statut === 'Actif').length;
      return `<tr><td><b>${esc(c.nom)}</b>${ct ? ' <span class="pill ok">sous contrat</span>' : ''}
          <div class="mini">${esc(c.niu ? 'NIU ' + c.niu : 'NIU non renseigné')}</div></td>
        <td class="mini">${esc(c.secteur || '—')}</td>
        <td class="mini">${esc(c.contact || '—')}<br>${esc(c.tel || '')}</td>
        <td class="mini">${esc(c.origine || '—')}</td>
        <td class="num">${fmc(ca)}</td>
        <td class="num">${en > 0 ? '<b style="color:var(--rouge)">' + fmc(en) + '</b>' : '—'}</td>
        <td class="num"><button class="btn sec sm" onclick="fClient('${c.id}')">Modifier</button></td></tr>`;
    }).join('') + `</tbody></table></div></div></div>`;
}

function fClient(id) {
  const c = id ? D.clients.find(x => x.id === id) : {};
  modal(id ? 'Modifier le client' : 'Nouveau client',
    champ('c_nom', 'Raison sociale *', c.nom) +
    `<div class="grid2">` + champ('c_sec', 'Secteur', c.secteur) + champ('c_org', 'Origine du contact', c.origine, 'select', '', ['', ...ORIGINES]) + `</div>` +
    `<div class="grid2">` + champ('c_niu', 'NIU du client', c.niu, 'text', 'Obligatoire sur vos factures entre entreprises') + champ('c_rccm', 'RCCM', c.rccm) + `</div>` +
    `<div class="grid2">` + champ('c_ct', 'Contact décideur', c.contact) + champ('c_fn', 'Fonction', c.fonction) + `</div>` +
    `<div class="grid2">` + champ('c_tel', 'Téléphone', c.tel, 'tel') + champ('c_em', 'Courriel', c.email, 'email') + `</div>` +
    champ('c_ad', 'Adresse', c.adresse) + champ('c_no', 'Notes', c.notes, 'textarea'),
    (id ? `<button class="btn sec" onclick="supClient('${id}')">Supprimer</button>` : '') +
    `<button class="btn sec" onclick="fermer()">Annuler</button>
     <button class="btn" onclick="saveClient('${id || ''}')">Enregistrer</button>`);
}
function saveClient(id) {
  const nom = val('c_nom');
  if (!nom) { toast('La raison sociale est obligatoire'); return; }
  const o = { nom, secteur: val('c_sec'), origine: val('c_org'), niu: val('c_niu'), rccm: val('c_rccm'),
    contact: val('c_ct'), fonction: val('c_fn'), tel: val('c_tel'), email: val('c_em'),
    adresse: val('c_ad'), notes: val('c_no') };
  if (id) Object.assign(D.clients.find(x => x.id === id), o);
  else D.clients.push(Object.assign({ id: uid(), cree: auj() }, o));
  sauver(); fermer(); router(); toast('Client enregistré');
}
function supClient(id) {
  if (D.factures.some(f => f.clientId === id) || D.devis.some(f => f.clientId === id)) {
    toast('Impossible : ce client a des devis ou des factures'); return;
  }
  D.clients = D.clients.filter(c => c.id !== id); sauver(); fermer(); router(); toast('Client supprimé');
}

/* ═══════════════════ LIGNES DE DOCUMENT ═══════════════════ */
let LIGNES = [];
function tableauLignes() {
  return `<table class="lignes"><thead><tr><th style="width:48%">Désignation</th><th style="width:13%" class="num">Qté</th>
    <th style="width:23%" class="num">Prix unitaire</th><th style="width:16%" class="num">Total</th><th></th></tr></thead>
    <tbody id="tbl">` + LIGNES.map((l, i) => ligneHtml(l, i)).join('') + `</tbody></table>
    <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn sec sm" onclick="addLigne()">+ Ajouter une ligne</button>
      <select id="catsel" style="width:auto;min-width:260px;max-width:100%;padding:7px 10px;font-size:13px" onchange="addDepuisCatalogue(this)">
        ${catalogueOptions()}
      </select>
    </div>
    <div id="recap" style="margin-top:16px">${recapHtml()}</div>`;
}
function catalogueOptions() {
  return '<option value="">Insérer depuis le catalogue…</option>' +
    CATALOGUE.map(([g, items]) => `<optgroup label="${esc(g)}">` +
      items.map(([n, p]) => `<option value="${esc(n)}|${p}">${esc(n)} — ${fm(p)} FCFA</option>`).join('') +
      '</optgroup>').join('');
}
function addDepuisCatalogue(sel) {
  if (!sel.value) return;
  const i = sel.value.lastIndexOf('|');
  LIGNES.push({ des: sel.value.slice(0, i), qte: 1, pu: +sel.value.slice(i + 1) });
  sel.value = ''; redrawLignes();
}
function ligneHtml(l, i) {
  return `<tr data-i="${i}">
    <td><input value="${esc(l.des || '')}" oninput="majLigne(${i},'des',this.value)" placeholder="Désignation précise, compréhensible sans vous"></td>
    <td><input type="number" step="any" class="num" value="${l.qte == null ? 1 : l.qte}" oninput="majLigne(${i},'qte',this.value)" style="text-align:right"></td>
    <td><input type="number" step="any" value="${l.pu == null ? '' : l.pu}" oninput="majLigne(${i},'pu',this.value)" style="text-align:right"></td>
    <td class="num" id="lt${i}"><b>${fm(N(l.qte) * N(l.pu))}</b></td>
    <td><button class="btn sec sm" onclick="delLigne(${i})">✕</button></td></tr>`;
}
function addLigne() { LIGNES.push({ des: '', qte: 1, pu: '' }); redrawLignes(); }
function delLigne(i) { LIGNES.splice(i, 1); redrawLignes(); }
function majLigne(i, k, v) {
  LIGNES[i][k] = v;
  const c = document.getElementById('lt' + i);
  if (c) c.innerHTML = '<b>' + fm(N(LIGNES[i].qte) * N(LIGNES[i].pu)) + '</b>';
  document.getElementById('recap').innerHTML = recapHtml();
}
function redrawLignes() {
  const t = document.getElementById('tbl');
  if (t) { t.innerHTML = LIGNES.map((l, i) => ligneHtml(l, i)).join(''); document.getElementById('recap').innerHTML = recapHtml(); }
}
function recapHtml() {
  const rem = nval('d_rem');
  const ht = LIGNES.reduce((s, l) => s + N(l.qte) * N(l.pu), 0);
  const net = ht - ht * rem / 100;
  return `<div style="background:var(--pale);border-radius:10px;padding:14px 16px">
    <div style="display:flex;justify-content:space-between;font-size:14px"><span>Total hors taxes</span><b>${fmc(ht)}</b></div>
    ${rem ? `<div style="display:flex;justify-content:space-between;font-size:14px;color:var(--rouge)"><span>Remise ${rem} %</span><b>− ${fmc(ht * rem / 100)}</b></div>` : ''}
    ${rem ? `<div style="display:flex;justify-content:space-between;font-size:14px"><span>Total hors taxes après remise</span><b>${fmc(net)}</b></div>` : ''}
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--gris)"><span>${esc(D.entreprise.mentionTva)}</span><b>${fmc(Math.round(net * tauxTva()))}</b></div>
    <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:800;color:var(--encre);
      border-top:1px solid var(--ligne);margin-top:9px;padding-top:9px"><span>Net à payer TTC</span><span>${fmc(net + Math.round(net * tauxTva()))}</span></div>
    <div style="font-size:12px;color:var(--gris);margin-top:6px">Soit ${esc(enLettres(net + Math.round(net * tauxTva())))} francs CFA.</div></div>`;
}

/* ═══════════════════ DEVIS ═══════════════════ */
const ST_DEVIS = ['Émis', 'Relancé', 'Accepté', 'Perdu', 'Annulé', 'Expiré'];

function vDevis(v, a) {
  a.innerHTML = `<button class="btn sm" onclick="fDevis()">+ Devis</button>`;
  if (!D.devis.length) {
    v.innerHTML = vide('Aucun devis. Le devis est votre outil de vente : chaque affaire commence ici.',
      `<button class="btn" onclick="fDevis()">Créer un devis</button>`); return;
  }
  const liste = D.devis.slice().sort((x, y) => (y.date || '').localeCompare(x.date || ''));
  const enCours = liste.filter(d => ['Émis', 'Relancé'].includes(d.statut));
  const acc = liste.filter(d => d.statut === 'Accepté').length;
  const perd = liste.filter(d => d.statut === 'Perdu').length;
  const tx = (acc + perd) ? Math.round(acc / (acc + perd) * 100) : 0;

  v.innerHTML = `<div class="kpis">
    <div class="kpi"><div class="lab">Devis en attente</div><div class="val">${enCours.length}</div>
      <div class="sub">${fmc(enCours.reduce((s, d) => s + totaux(d).ttc, 0))} sur la table</div></div>
    <div class="kpi ok"><div class="lab">Taux de transformation</div><div class="val">${tx} %</div>
      <div class="sub">${acc} gagné(s) · ${perd} perdu(s) — objectif 40 %</div></div>
    <div class="kpi warn"><div class="lab">Prochain numéro</div><div class="val" style="font-size:19px">${nextNum('DEV', D.devis)}</div>
      <div class="sub">Numérotation continue, sans trou</div></div>
  </div>
  <div class="card"><div class="body p0"><div class="tw"><table>
  <thead><tr><th>N°</th><th>Client</th><th>Objet</th><th class="num">Montant</th><th>Statut</th><th></th></tr></thead><tbody>` +
    liste.map(d => {
      const exp = ['Émis', 'Relancé'].includes(d.statut) && jours(d.date) > N(d.validite || 15);
      return `<tr><td><b>${esc(d.num)}</b><div class="mini">${fdate(d.date)}${exp ? ' · <span style="color:var(--rouge)">expiré</span>' : ''}</div></td>
      <td>${esc(nomClient(d.clientId))}</td>
      <td class="mini" style="max-width:280px">${esc(d.objet || '—')}</td>
      <td class="num"><b>${fmc(totaux(d).ttc)}</b></td>
      <td><span class="pill ${d.statut === 'Accepté' ? 'ok' : d.statut === 'Perdu' || d.statut === 'Annulé' ? 'red' : 'blue'}">${esc(d.statut)}</span></td>
      <td class="num" style="white-space:nowrap">
        <button class="btn sec sm" onclick="imprimer('devis','${d.id}')">Imprimer</button>
        ${d.statut === 'Accepté' && !D.factures.some(f => f.devisId === d.id)
          ? `<button class="btn sm" onclick="devisEnFacture('${d.id}')">→ Facture</button>` : ''}
        <button class="btn sec sm" onclick="fDevis('${d.id}')">Ouvrir</button></td></tr>`;
    }).join('') + `</tbody></table></div></div></div>`;
}

function fDevis(id) {
  const d = id ? D.devis.find(x => x.id === id) : { date: auj(), validite: N(D.entreprise.validiteDevis) || 15, statut: 'Émis', remise: 0, proba: 50 };
  LIGNES = id ? JSON.parse(JSON.stringify(d.lignes || [])) : [{ des: '', qte: 1, pu: '' }];
  if (!LIGNES.length) LIGNES = [{ des: '', qte: 1, pu: '' }];
  modal(id ? 'Devis ' + d.num : 'Nouveau devis',
    `<div class="grid3">` + champ('d_date', 'Date d’émission', d.date, 'date') +
      champ('d_val', 'Validité (jours)', d.validite, 'number', 'Ne dépassez pas 15 jours si le devis comporte du matériel') +
      champ('d_st', 'Statut', d.statut, 'select', '', ST_DEVIS) + `</div>` +
    selClient('d_cl', d.clientId) +
    champ('d_obj', 'Objet', d.objet, 'textarea', 'Reprenez le besoin du client avec ses mots. C’est la partie la plus lue du devis.') +
    `<h4 style="font-size:12.5px;font-weight:800;letter-spacing:1px;color:var(--indigo);text-transform:uppercase;margin:18px 0 10px">Détail de la prestation</h4>` +
    tableauLignes() +
    `<div class="grid2" style="margin-top:16px">` +
      champ('d_rem', 'Remise (%)', d.remise || 0, 'number', 'Toujours contre une contrepartie : engagement, volume, référence') +
      champ('d_proba', 'Probabilité (%)', d.proba == null ? 50 : d.proba, 'number') + `</div>` +
    champ('d_excl', 'Ce qui n’est PAS inclus', d.exclusions, 'textarea',
      'Votre meilleure protection contre la dérive de périmètre. Une ligne par élément exclu.'),
    (id ? `<button class="btn sec" onclick="supDoc('devis','${id}')">Supprimer</button>` : '') +
    `<button class="btn sec" onclick="fermer()">Annuler</button>
     <button class="btn" onclick="saveDevis('${id || ''}')">Enregistrer</button>`, true);
  const r = document.getElementById('d_rem');
  if (r) r.addEventListener('input', () => { document.getElementById('recap').innerHTML = recapHtml(); });
}
function saveDevis(id) {
  if (!val('d_cl')) { toast('Choisissez un client'); return; }
  LIGNES = LIGNES.filter(l => (l.des || '').trim() || N(l.pu));
  if (!LIGNES.length) { toast('Ajoutez au moins une ligne'); return; }
  const o = { date: val('d_date') || auj(), validite: nval('d_val'), statut: val('d_st'), clientId: val('d_cl'),
    objet: val('d_obj'), lignes: LIGNES, remise: nval('d_rem'), proba: nval('d_proba'), exclusions: val('d_excl') };
  if (id) Object.assign(D.devis.find(x => x.id === id), o);
  else D.devis.push(Object.assign({ id: uid(), num: nextNum('DEV', D.devis) }, o));
  sauver(); fermer(); router(); toast('Devis enregistré');
}
function supDoc(type, id) { D[type] = D[type].filter(x => x.id !== id); sauver(); fermer(); router(); toast('Supprimé'); }

function devisEnFacture(id) {
  const d = D.devis.find(x => x.id === id);
  const f = { id: uid(), num: nextNum('FAC', D.factures), date: auj(),
    echeance: plusJours(auj(), N(D.entreprise.delaiPaiement) || 30),
    clientId: d.clientId, devisId: d.id, objet: d.objet, lignes: JSON.parse(JSON.stringify(d.lignes)),
    remise: d.remise, acompte: 0, paiements: [] };
  D.factures.push(f); sauver(); location.hash = '#factures'; router();
  toast('Facture ' + f.num + ' créée depuis le devis');
}

/* ═══════════════════ FACTURES ═══════════════════ */
function vFactures(v, a) {
  a.innerHTML = `<button class="btn sm" onclick="fFacture()">+ Facture</button>`;
  if (!D.factures.length) {
    v.innerHTML = vide('Aucune facture. Facturez à la livraison, jamais en fin de mois : chaque jour de retard est un jour d’encaissement perdu.',
      `<button class="btn" onclick="fFacture()">Créer une facture</button>`); return;
  }
  const liste = D.factures.slice().sort((x, y) => (y.date || '').localeCompare(x.date || ''));
  v.innerHTML = `<div class="kpis">
    <div class="kpi"><div class="lab">Facturé ${anneeEnCours()}</div><div class="val">${fm(caFacture())}</div><div class="sub">francs CFA</div></div>
    <div class="kpi ok"><div class="lab">Encaissé</div><div class="val">${fm(caEncaisse())}</div>
      <div class="sub">${caFacture() ? Math.round(caEncaisse() / caFacture() * 100) : 0} % du facturé</div></div>
    <div class="kpi red"><div class="lab">Reste à encaisser</div><div class="val">${fm(encours())}</div>
      <div class="sub">${D.factures.filter(f => reste(f) > 0).length} facture(s) ouverte(s)</div></div>
  </div>
  <div class="card"><div class="body p0"><div class="tw"><table>
  <thead><tr><th>N°</th><th>Client</th><th class="num">Montant</th><th class="num">Encaissé</th>
  <th class="num">Reste</th><th>État</th><th></th></tr></thead><tbody>` +
    liste.map(f => { const s = statutFacture(f), t = totaux(f).ttc, enc = N(f.acompte) + paye(f);
      return `<tr><td><b>${esc(f.num)}</b><div class="mini">${fdate(f.date)} · éch. ${fdate(f.echeance)}</div></td>
      <td>${esc(nomClient(f.clientId))}</td>
      <td class="num">${fmc(t)}</td>
      <td class="num">${fmc(enc)}</td>
      <td class="num">${reste(f) > 0 ? '<b style="color:var(--rouge)">' + fmc(reste(f)) + '</b>' : '—'}</td>
      <td><span class="pill ${s.c}">${s.t}</span>${reste(f) > 0 && s.j > 0 ? `<div class="mini">${s.j} j</div>` : ''}</td>
      <td class="num" style="white-space:nowrap">
        ${reste(f) > 0 ? `<button class="btn sm" onclick="fPaiement('${f.id}')">Encaisser</button>` : ''}
        <button class="btn sec sm" onclick="imprimer('facture','${f.id}')">Imprimer</button>
        <button class="btn sec sm" onclick="fFacture('${f.id}')">Ouvrir</button></td></tr>`; }).join('') +
    `</tbody></table></div></div></div>`;
}

function fFacture(id) {
  const f = id ? D.factures.find(x => x.id === id) : { date: auj(), echeance: plusJours(auj(), N(D.entreprise.delaiPaiement) || 30), remise: 0, acompte: 0, paiements: [] };
  LIGNES = id ? JSON.parse(JSON.stringify(f.lignes || [])) : [{ des: '', qte: 1, pu: '' }];
  if (!LIGNES.length) LIGNES = [{ des: '', qte: 1, pu: '' }];
  const hist = (f.paiements || []).length
    ? `<h4 style="font-size:12.5px;font-weight:800;letter-spacing:1px;color:var(--indigo);text-transform:uppercase;margin:18px 0 10px">Encaissements</h4>
       <table><tbody>` + f.paiements.map((p, i) => `<tr><td>${fdate(p.date)}</td><td class="mini">${esc(p.mode || '')}</td>
       <td class="num"><b>${fmc(p.montant)}</b></td>
       <td class="num"><button class="btn sec sm" onclick="delPaiement('${id}',${i})">✕</button></td></tr>`).join('') + `</tbody></table>` : '';
  modal(id ? 'Facture ' + f.num : 'Nouvelle facture',
    `<div class="grid2">` + champ('d_date', 'Date d’émission', f.date, 'date') +
      champ('f_ech', 'Échéance de paiement', f.echeance, 'date') + `</div>` +
    selClient('d_cl', f.clientId) +
    champ('d_obj', 'Objet', f.objet, 'textarea') +
    `<h4 style="font-size:12.5px;font-weight:800;letter-spacing:1px;color:var(--indigo);text-transform:uppercase;margin:18px 0 10px">Détail</h4>` +
    tableauLignes() +
    `<div class="grid2" style="margin-top:16px">` + champ('d_rem', 'Remise (%)', f.remise || 0, 'number') +
      champ('f_ac', 'Acompte déjà réglé', f.acompte || 0, 'number') + `</div>` + hist,
    (id ? `<button class="btn sec" onclick="supDoc('factures','${id}')">Supprimer</button>` : '') +
    `<button class="btn sec" onclick="fermer()">Annuler</button>
     <button class="btn" onclick="saveFacture('${id || ''}')">Enregistrer</button>`, true);
  const r = document.getElementById('d_rem');
  if (r) r.addEventListener('input', () => { document.getElementById('recap').innerHTML = recapHtml(); });
}
function saveFacture(id) {
  if (!val('d_cl')) { toast('Choisissez un client'); return; }
  LIGNES = LIGNES.filter(l => (l.des || '').trim() || N(l.pu));
  if (!LIGNES.length) { toast('Ajoutez au moins une ligne'); return; }
  const o = { date: val('d_date') || auj(), echeance: val('f_ech'), clientId: val('d_cl'), objet: val('d_obj'),
    lignes: LIGNES, remise: nval('d_rem'), acompte: nval('f_ac') };
  if (id) Object.assign(D.factures.find(x => x.id === id), o);
  else D.factures.push(Object.assign({ id: uid(), num: nextNum('FAC', D.factures), paiements: [] }, o));
  sauver(); fermer(); router(); toast('Facture enregistrée');

function saveProspect(id) {
  const nom = val('x_nom');
  if (!nom) { toast('Le nom de l’entreprise est obligatoire'); return; }
  const prev = id ? D.prospects.find(x => x.id === id) : null;
  let etape = val('x_et'), ss = val('x_ss');
  if (prev) {
    const ssPrev = prev.statutSuivi || ETAPE_VERS_SUIVI[prev.etape] || 'Nouveau';
    if (ss !== ssPrev && SUIVI_VERS_ETAPE[ss]) etape = SUIVI_VERS_ETAPE[ss];          // le statut a été changé : l'étape suit
    else if (etape !== prev.etape) ss = ETAPE_VERS_SUIVI[etape] || ss;                // l'étape a été changée : le statut suit
  } else if (ss !== 'Nouveau' && etape === 'Identifié' && SUIVI_VERS_ETAPE[ss]) etape = SUIVI_VERS_ETAPE[ss];
  else if (etape !== 'Identifié' && ss === 'Nouveau') ss = ETAPE_VERS_SUIVI[etape] || ss;
  const o = { nom, contact: val('x_ct'), tel: val('x_tel'), mail: val('x_ml'), dateContact: val('x_dc'), secteur: val('x_sec'), sousSecteur: val('x_ssec'),
    origine: val('x_org'), domaine: val('x_dm'), besoin: val('x_bs'), statutSuivi: ss,
    etape, montant: nval('x_mt'), proba: nval('x_pr'),
    prochaineAction: val('x_pa'), dateAction: val('x_da'), notes: val('x_no') };
  if (prev) Object.assign(prev, o);
  else D.prospects.push(Object.assign({ id: uid() }, o));
  sauver(); fermer(); router(); toast('Prospect enregistré');
}
function prospectEnClient(id) {
  const p = D.prospects.find(x => x.id === id);
  D.clients.push({ id: uid(), nom: p.nom, secteur: p.secteur, contact: p.contact, tel: p.tel,
    origine: p.origine, notes: p.notes, cree: auj() });
  p.etape = 'Gagné';
  sauver(); fermer(); location.hash = '#clients'; router(); toast('Converti en client');
}

/* ───────────────────────── CSV : lecture et écriture ───────────────────────── */
function csvLire(txt) {
  txt = String(txt).replace(/^﻿/, '');
  const prem = txt.split(/\r?\n/)[0] || '';
  const sep = (prem.match(/;/g) || []).length >= (prem.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) {
      if (c === '"') { if (txt[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c;
    } else if (c === '"' && cur === '') q = true;
    else if (c === sep) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && txt[i + 1] === '\n') i++;
      row.push(cur); cur = '';
      if (row.some(x => x.trim())) rows.push(row);
      row = [];
    } else cur += c;
  }
  if (cur || row.length) { row.push(cur); if (row.some(x => x.trim())) rows.push(row); }
  return rows;
}
/* Retourne des objets indexés par les en-têtes normalisés. Une ligne qui a trop de colonnes (point-virgule non protégé
   dans un texte) voit l'excédent réuni dans la colonne « angle d'approche » ou, à défaut, dans la dernière colonne de texte. */
function csvTable(txt, colonneExces) {
  const rows = csvLire(txt);
  if (rows.length < 2) return { tete: [], lignes: [] };
  const tete = rows[0].map(nrm);
  const iEx = colonneExces ? tete.indexOf(colonneExces) : -1;
  const lignes = rows.slice(1, 2001).map(r => {
    if (r.length > tete.length && iEx >= 0) {
      const extra = r.length - tete.length;
      r = r.slice(0, iEx).concat([r.slice(iEx, iEx + extra + 1).map(s => s.trim()).join('; ')], r.slice(iEx + extra + 1));
    }
    const o = {}; tete.forEach((h, i) => { o[h] = (r[i] || '').trim(); });
    return o;
  });
  return { tete, lignes };
}
function csvCellule(s) {
  s = String(s == null ? '' : s).replace(/\r?\n/g, ' ');
  if (/^[=@]|^[+\-](?![0-9 ()])/.test(s)) s = "'" + s;      // neutralise les formules des tableurs
  return /[;"]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvEcrire(tete, lignes) {
  return '﻿' + [tete].concat(lignes).map(l => l.map(csvCellule).join(';')).join('\r\n') + '\r\n';
}
function dateIso(s) {
  s = String(s || '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/);
  if (!m) return '';
  const y = m[3].length === 2 ? '20' + m[3] : m[3];
  return y + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
}
function lireFichier(inp, fn) {
  const f = inp.files[0]; if (!f) return;
  if (f.size > 1000000) { toast('Fichier trop volumineux (1 Mo maximum)'); inp.value = ''; return; }
  const r = new FileReader();
  r.onload = () => { try { fn(String(r.result)); } catch (e) { console.warn(e); toast('Fichier illisible'); } };
  r.readAsText(f, 'utf-8'); inp.value = '';
}

function cibImporter(inp) {
  lireFichier(inp, txt => {
    const t = csvTable(txt, "angle d'approche");
    if (t.tete.indexOf('etablissement') < 0) { toast('Colonne « Établissement » introuvable : est-ce bien Cibles_Terrain.csv ?'); return; }
    const colSous = t.tete.find(h => /^sous.?secteur/.test(h)) || '';
    const connus = new Set(cib().map(c => nrm(c.nom)));
    let n = 0, d = 0;
    t.lignes.forEach(l => {
      const nom = l['etablissement'];
      if (!nom) return;
      if (connus.has(nrm(nom))) { d++; return; }
      connus.add(nrm(nom));
      let secteur = l['secteur'] || '', sous = colSous ? (l[colSous] || '') : '';
      if (!colSous) { const m = secteur.split(' - '); if (m.length > 1) { secteur = m[0]; sous = m.slice(1).join(' - '); } }   // ancien format : « Santé - dentaire »
      cib().push({ id: uid(), tournee: l['tournee'] || '', priorite: l['priorite'] || '', nom, secteur, sousSecteur: sous,
        repere: l['repere'] || '', angle: l["angle d'approche"] || '', statut: l['statut'] || 'À visiter',
        dateVisite: dateIso(l['date de visite']), decideur: l['decideur (fonction)'] || '',
        action: l['prochaine action'] || '', echeance: dateIso(l['echeance']), notes: l['notes'] || '' });
      n++;
    });
    sauver(); VIS_ONGLET = 'cibles'; router();
    toast(n + ' cible(s) ajoutée(s)' + (d ? ', ' + d + ' déjà présente(s)' : ''));
  });
}
function cibExporter() {
  const tete = ['Tournée', 'Priorité', 'Établissement', 'Secteur', 'Sous-secteur ou domaine', 'Repère', "Angle d'approche", 'Statut', 'Date de visite',
    'Décideur (fonction)', 'Prochaine action', 'Échéance', 'Notes'];
  const derniere = c => vis().filter(v => v.cibleId === c.id || nrm(v.nom) === nrm(c.nom))

function cibSauver(id) {
  const nom = val('k_nom');
  if (!nom) { toast('Le nom de l’établissement est obligatoire'); return; }
  const dup = cib().find(q => q.id !== id && nrm(q.nom) === nrm(nom));
  if (dup) { toast('Cette cible existe déjà'); return; }
  const o = { nom, tournee: val('k_tour'), priorite: val('k_pri'), statut: val('k_stat') || 'À visiter', secteur: val('k_sec'), sousSecteur: val('k_ssec'),
    repere: val('k_rep'), angle: val('k_ang'), notes: val('k_not') };
  if (id) Object.assign(cib().find(q => q.id === id), o);
  else cib().push(Object.assign({ id: uid(), dateVisite: '', decideur: '', action: '', echeance: '' }, o));
  sauver(); fermer(); router(); toast('Cible enregistrée');
}
function cibSupprimer(id) {
  const c = cib().find(q => q.id === id);
  if (!c || !confirm('Supprimer la cible « ' + c.nom + ' » ? Les fiches de visite déjà saisies sont conservées.')) return;
  D.cibles = cib().filter(q => q.id !== id);
  sauver(); fermer(); router(); toast('Cible supprimée');
}

  h += `<div class="lst">` + V.slice().sort((x, y) => (y.date + (y.heure || '')).localeCompare(x.date + (x.heure || ''))).map(x => {
    const retard = x.echeance && x.echeance < auj() && !x.fait && x.issue !== 'pas_interesse';
    return `<div class="lc"><div class="tx"><div class="tt">${esc(x.nom)}</div>
      <div class="mt">${fdate(x.date)}${x.heure ? ' à ' + esc(x.heure) : ''}${x.contact ? ' · ' + esc(x.contact) : ''}${x.tel ? ' · ' + esc(x.tel) : ''}</div>
      ${x.besoin ? `<div class="mt"><i>${esc(x.besoin.length > 140 ? x.besoin.slice(0, 140) + '…' : x.besoin)}</i></div>` : ''}
      ${x.action ? `<div class="mt">${x.fait ? '✓ ' : '→ '}${esc(x.action)}${x.echeance ? ' · ' + (retard ? '<b style="color:var(--rouge)">' + fdate(x.echeance) + '</b>' : fdate(x.echeance)) : ''}</div>` : ''}</div>

function visIssue() {
  const i = val('v_iss'), d = document.getElementById('v_isd'), act = document.getElementById('v_act'), ech = document.getElementById('v_ech');
  if (i === 'plus_tard' && !d.value) d.value = plusJours(auj(), 90);
  const defs = { diagnostic: 'Diagnostic informatique offert (45 min)', rappel: 'Rappeler', plus_tard: 'Recontacter' };
  if (defs[i] && !act.value) act.value = defs[i];
  if (i && i !== 'pas_interesse' && !ech.value && d.value) ech.value = d.value;

function visSauver(id) {
  const nom = val('v_nom');
  if (!nom) { toast('Le nom de l’établissement est obligatoire'); return; }
  if (!val('v_date')) { toast('La date est obligatoire'); return; }
  const prec = id ? vis().find(q => q.id === id) : null;
  const o = {
    cibleId: val('v_cib'), nom, date: val('v_date'), heure: val('v_heure'), tournee: val('v_tour'), secteur: val('v_sec'), sousSecteur: val('v_ssec'),
    contact: val('v_ct'), role: val('v_role'), tel: val('v_tel'), mail: val('v_mail'), decideur: val('v_dec'),
    vu: { accueil: val('v_acc'), cameras: chk('v_cam'), acces: chk('v_acs'), serveur: chk('v_srv'), postes: val('v_pos'), sites: val('v_sit'), prestataire: val('v_pre') },
    remis: { lettre: chk('v_r1'), diag: chk('v_r2'), dix: chk('v_r3'), carte: chk('v_r4'), plaquette: chk('v_r5') },
    issue: val('v_iss'), issueDate: val('v_isd'), issueHeure: val('v_ish'), issueRaison: val('v_isr'),
    action: val('v_act'), echeance: val('v_ech'), fait: chk('v_fait'), report: chk('v_rep'), maj: Date.now()
  };
  QUESTIONS.forEach(q => { o[q[0]] = val('v_' + q[0]); });
  if (o.issue && o.issue !== 'pas_interesse') {
    if (!o.echeance && o.issueDate) o.echeance = o.issueDate;
    if (!o.action) o.action = { diagnostic: 'Diagnostic informatique offert (45 min)', rappel: 'Rappeler', plus_tard: 'Recontacter' }[o.issue] || '';
  }
  let x;
  if (prec) { x = Object.assign(prec, o); }
  else { x = Object.assign({ id: uid(), cree: auj() }, o); vis().push(x); }
  const cible = x.cibleId ? cib().find(q => q.id === x.cibleId) : null;
  if (cible) { cible.statut = STATUT_CIBLE[x.issue || '']; cible.dateVisite = x.date; }
  if (x.report) visVersProspect(x, !!prec);
  sauver(); fermer(); router(); toast('Fiche enregistrée');
}

function visVersProspect(x, dejaReporte) {
  const perdu = x.issue === 'pas_interesse';
  const ss = ISSUE_VERS_SUIVI[x.issue || ''];
  const resume = 'Visite du ' + fdate(x.date) + (x.besoin ? ' — ' + x.besoin : '') + (perdu && x.issueRaison ? ' — motif : ' + x.issueRaison : '');
  let p = (x.prospectId && D.prospects.find(q => q.id === x.prospectId)) || D.prospects.find(q => nrm(q.nom) === nrm(x.nom));
  if (!p) {
    p = { id: uid(), nom: x.nom, contact: x.contact, tel: x.tel, mail: x.mail, secteur: x.secteur, sousSecteur: x.sousSecteur, origine: 'Prospection terrain', canal: 'Prospection terrain',
      dateContact: x.date, besoin: x.besoin, etape: SUIVI_VERS_ETAPE[ss] || 'Contacté', statutSuivi: ss, montant: 0,
      proba: perdu ? 0 : x.issue === 'diagnostic' ? 20 : 10,
      prochaineAction: perdu ? '' : x.action, dateAction: perdu ? '' : x.echeance, notes: resume };
    D.prospects.push(p);
  } else {
    if (x.contact) p.contact = x.contact;
    if (x.tel) p.tel = x.tel;
    if (x.mail) p.mail = x.mail;
    if (!p.secteur && x.secteur) p.secteur = x.secteur;
    if (!p.sousSecteur && x.sousSecteur) p.sousSecteur = x.sousSecteur;
    if (!p.dateContact) p.dateContact = x.date;
    if (x.besoin) p.besoin = x.besoin;
    if (['Identifié', 'Contacté'].includes(p.etape)) {                       // jamais de retour en arrière sur une affaire avancée
      p.statutSuivi = ss;
      if (SUIVI_VERS_ETAPE[ss]) { p.etape = SUIVI_VERS_ETAPE[ss]; if (perdu) p.proba = 0; else if (x.issue === 'diagnostic') p.proba = Math.max(N(p.proba), 20); }
    }
    if (!perdu && x.action) { p.prochaineAction = x.action; if (x.echeance) p.dateAction = x.echeance; }
    if (!dejaReporte) p.notes = ((p.notes ? p.notes + '\n' : '') + resume).trim();
  }
  x.prospectId = p.id;
}

function visSupprimer(id) {
  if (!confirm('Supprimer cette fiche de visite ?')) return;
  const x = vis().find(q => q.id === id);
  D.visites = vis().filter(q => q.id !== id);
  if (x && x.cibleId && !vis().some(q => q.cibleId === x.cibleId)) {
    const c = cib().find(q => q.id === x.cibleId); if (c) { c.statut = 'À visiter'; c.dateVisite = ''; }
  }
  sauver(); fermer(); router(); toast('Fiche supprimée');
}

    <div class="alert info" style="margin-top:14px"><b>Comment cela fonctionne.</b> L'application continue de

  <div class="card"><h3>Installer l’application sur votre téléphone</h3><div class="body">

function enregistrerFirebase() {
  const cfg = { apiKey: val('f_api'), authDomain: val('f_dom'), projectId: val('f_prj'),
    storageBucket: val('f_bkt'), messagingSenderId: val('f_snd'), appId: val('f_app') };
  if (!cfg.apiKey || !cfg.projectId) { toast('apiKey et projectId sont indispensables'); return; }
  fbConfigEcrire(cfg); FB = null; router();
  toast('Configuration enregistrée — connectez-vous maintenant');
}
async function connecterNuage() {
  const em = val('s_em'), mp = val('s_mp');
  if (!em || !mp) { toast('Renseignez l\'adresse et le mot de passe'); return; }
  badgeSync('connexion');
  try { await nuageConnexion(em, mp); toast('Connecté — synchronisation active'); }
  catch (e) {
    console.warn(e); badgeSync('erreur');
    const c = (e && e.code) || '';
    toast(c.indexOf('invalid-cred') >= 0 || c.indexOf('wrong-password') >= 0 || c.indexOf('user-not-found') >= 0
      ? 'Identifiants refusés' : 'Connexion impossible : ' + (c || 'vérifiez la configuration'));
  }
}
function saveEntreprise() {
  Object.assign(D.entreprise, {
    nom: val('e_nom'), forme: val('e_forme'), proprio: val('e_prop'), rccm: val('e_rccm'), niu: val('e_niu'),
    adresse: val('e_ad'), tel: val('e_tel'), email: val('e_em'), banque: val('e_bq'), rib: val('e_rib'),
    momo: val('e_momo'), regime: val('e_reg'), mentionTva: val('e_tva'),
    validiteDevis: nval('e_val'), delaiPaiement: nval('e_del'), penalite: val('e_pen'),
    seuilMensuel: nval('e_seuil'), tauxTva: nval('e_tauxtva'), tauxAcompteIs: nval('e_acis')
  });
  sauver(); router(); toast('Paramètres enregistrés');
}
function telecharger(nom, contenu, type) {
  const b = new Blob([contenu], { type: type || 'application/json' });
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = nom; a.click(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}
function exporter() {
  telecharger('DB-sauvegarde-' + auj() + '.json', JSON.stringify(D, null, 1));
  toast('Sauvegarde exportée — envoyez-la-vous par WhatsApp');
}
function importer(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.clients) throw 0;
      if (!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
      D = Object.assign({}, DEFAUT, d, { entreprise: Object.assign({}, DEFAUT.entreprise, d.entreprise || {}) });
      sauver(); router(); toast('Sauvegarde restaurée');
    } catch (e) { toast('Fichier illisible'); }
  };
  r.readAsText(f); inp.value = '';
}
function exporterCsv() {
  const l = [['Numero', 'Date', 'Echeance', 'Client', 'NIU client', 'Objet', 'Montant HT', 'TVA', 'Montant TTC', 'Encaisse', 'Reste', 'Statut']];
  D.factures.forEach(f => {
    const c = client(f.clientId) || {};
    l.push([f.num, f.date, f.echeance, c.nom || '', c.niu || '', (f.objet || '').replace(/[\r\n;]/g, ' '),
      totaux(f).net, totaux(f).tva, totaux(f).ttc, N(f.acompte) + paye(f), reste(f), statutFacture(f).t]);
  });
  telecharger('DB-factures-' + auj() + '.csv', '﻿' + l.map(r => r.join(';')).join('\n'), 'text/csv');
  toast('Export CSV pour votre comptable');
}

/* ═══════════════════ IMPRESSION DEVIS / FACTURE ═══════════════════ */
const MARQUE = `<svg viewBox="0 0 188 188"><rect width="188" height="188" rx="44" fill="#3E4CB8"/>
  <g transform="translate(50,34) scale(1.06)"><path d="M8 4 L8 92 L30 70 L46 108 L64 100 L48 63 L76 60 Z"
  fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></g></svg>`;

function imprimer(type, id) {
  const doc = (type === 'devis' ? D.devis : D.factures).find(x => x.id === id);
  if (!doc) return;
  const e = D.entreprise, c = client(doc.clientId) || {};
  const t = totaux(doc);
  const encaisse = type === 'facture' ? N(doc.acompte) + paye(doc) : 0;
  const du = type === 'facture' ? t.ttc - encaisse : t.ttc;
  const titre = type === 'devis' ? 'DEVIS' : 'FACTURE';

  const meta = type === 'devis'
    ? [['N°', doc.num], ['Date', fdate(doc.date)],
       ['Validité', N(doc.validite || 15) + ' jours, soit jusqu’au ' + fdate(plusJours(doc.date, N(doc.validite || 15)))]]
    : [['N°', doc.num], ['Date', fdate(doc.date)], ['Échéance', fdate(doc.echeance)]]
      .concat(doc.devisId ? [['Référence', (D.devis.find(x => x.id === doc.devisId) || {}).num || '']] : []);

  let lignesTot = `<tr class="tot"><td colspan="4" style="text-align:right">Total hors taxes</td><td class="num">${fm(t.ht)}</td></tr>`;
  if (t.rem) lignesTot += `<tr class="tot"><td colspan="4" style="text-align:right">Remise ${N(doc.remise)} %</td><td class="num">− ${fm(t.rem)}</td></tr>`;
  lignesTot += `<tr class="tot"><td colspan="4" style="text-align:right">${esc(e.mentionTva)}</td><td class="num">${fm(t.tva)}</td></tr>`;
  if (type === 'facture' && encaisse) {
    lignesTot += `<tr class="tot"><td colspan="4" style="text-align:right">Total TTC</td><td class="num">${fm(t.ttc)}</td></tr>`;
    lignesTot += `<tr class="tot"><td colspan="4" style="text-align:right">Déjà réglé</td><td class="num">− ${fm(encaisse)}</td></tr>`;
  }
  lignesTot += `<tr class="tot big"><td colspan="4" style="text-align:right">NET À PAYER (FCFA)</td><td class="num">${fm(du)}</td></tr>`;

  const excl = (doc.exclusions || '').trim();

  document.getElementById('print').innerHTML = `<div class="doc">
    <div class="hd">
      <div class="lg">${MARQUE}<div><b>D<i>&amp;</i>B</b><span>INFORMATIQUE</span></div></div>
      <div class="rr"><div class="t">${titre}</div>` +
        meta.map(([k, v]) => `<div>${esc(k)} : <b>${esc(v)}</b></div>`).join('') + `</div>
    </div>

    <div class="parties">
      <div class="em"><div class="lb">ÉMETTEUR</div>
        <b>${esc(e.nom)}</b><br>${esc(e.forme)}${e.proprio ? '<br>' + esc(e.proprio) : ''}<br>
        ${esc(e.adresse)}<br>RCCM : ${esc(e.rccm || '—')}<br>NIU : ${esc(e.niu || '—')}<br>
        ${esc(e.tel)} · ${esc(e.email)}</div>
      <div class="cl"><div class="lb">${type === 'devis' ? 'CLIENT' : 'FACTURÉ À'}</div>
        <b>${esc(c.nom || '—')}</b><br>${esc(c.adresse || '')}<br>
        NIU : ${esc(c.niu || '—')}<br>${c.contact ? 'À l’attention de : ' + esc(c.contact) : ''}
        ${c.fonction ? ', ' + esc(c.fonction) : ''}<br>${esc(c.tel || '')}</div>
    </div>

    ${doc.objet ? `<h4>OBJET</h4><div style="font-size:10.5px;line-height:1.6">${esc(doc.objet).replace(/\n/g, '<br>')}</div>` : ''}

    <h4>DÉTAIL DE LA PRESTATION</h4>
    <table><thead><tr><th style="width:7%">Réf.</th><th style="width:48%">Désignation</th>
      <th style="width:9%" class="num">Qté</th><th style="width:18%" class="num">P.U. HT</th>
      <th style="width:18%" class="num">Montant HT</th></tr></thead><tbody>` +
      (doc.lignes || []).map((l, i) => `<tr><td>${String(i + 1).padStart(2, '0')}</td>
        <td>${esc(l.des)}</td><td class="num">${N(l.qte)}</td>
        <td class="num">${fm(l.pu)}</td><td class="num">${fm(N(l.qte) * N(l.pu))}</td></tr>`).join('') +
      lignesTot + `</tbody></table>

    <div style="font-size:10.5px;margin-top:4mm">Arrêté${type === 'facture' ? 'e la présente facture' : ' le présent devis'}
      à la somme de : <b>${esc(enLettres(du))} francs CFA</b>.</div>

    ${excl ? `<h4>CE QUI N’EST PAS INCLUS</h4><div style="font-size:10px;line-height:1.7">` +
      excl.split('\n').filter(Boolean).map(x => '· ' + esc(x)).join('<br>') +
      `<br>· Toute demande hors du présent périmètre fera l’objet d’un avenant écrit et chiffré, accepté avant exécution.</div>` : ''}

    <h4>${type === 'devis' ? 'MODALITÉS' : 'RÈGLEMENT'}</h4>
    <div class="mentions">
      ${type === 'devis'
        ? `<b>Acompte :</b> 50 % à la commande, solde à la réception contre procès-verbal signé. Les délais de réalisation courent à compter de l’encaissement de l’acompte, et non de la signature.<br>`
        : `<b>Échéance :</b> ${fdate(doc.echeance)}. Merci de rappeler la référence <b>${esc(doc.num)}</b> sur le virement.<br>`}
      <b>Virement :</b> ${esc(e.banque || '[banque]')} — ${esc(e.rib || '[RIB]')}<br>
      <b>Mobile Money :</b> ${esc(e.momo || '—')}<br>
      <b>Pénalités de retard :</b> ${esc(e.penalite)}, exigibles sans mise en demeure préalable.<br>
      <b>Réserve de propriété :</b> le matériel demeure la propriété de ${esc(e.nom)} jusqu’au paiement intégral.<br>
      <b>Garantie :</b> 12 mois sur la main-d’œuvre, garantie constructeur sur le matériel.<br>
      Les conditions générales de vente jointes font partie intégrante du présent document.
    </div>

    ${type === 'devis' ? `<div class="sign">
      <div><b>Pour ${esc(e.nom)}</b>${esc(e.proprio)}<br>Date : ${fdate(doc.date)}<br>Signature et cachet :</div>
      <div><b>BON POUR ACCORD — Le client</b>Nom et fonction : ______________________<br>
        Date : ______________________<br>Mention manuscrite « Bon pour accord », signature et cachet :</div>
    </div>` : `<div style="margin-top:8mm;text-align:right;font-size:10px">
      <b style="color:var(--encre)">${esc(e.nom)} — ${esc(e.proprio)}</b><br>Cachet de l’entreprise :</div>`}

    <div class="pied">${esc(e.nom)} · ${esc(e.forme)} · ${esc(e.adresse)} · ${esc(e.tel)} · ${esc(e.email)}<br>
      RCCM : ${esc(e.rccm || '[à compléter]')} · NIU : ${esc(e.niu || '[à compléter]')} · Régime ${esc(e.regime)}</div>
  </div>`;

  if (!e.rccm || !e.niu) toast('Attention : RCCM ou NIU manquant sur ce document');
  setTimeout(() => window.print(), 120);
}

/* Le service worker n'est enregistré que s'il existe un vrai fichier sw.js à côté de la page
   (cas de l'hébergement GitHub Pages). Un worker créé depuis une URL blob: est refusé par les
   navigateurs : c'est pourquoi on passe par un fichier. En ouverture locale, on ne fait rien. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
